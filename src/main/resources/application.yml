# ─────────────────────────────────────────────────────────────────────────────
# Employee Directory — DDD + Hexagonal Architecture
# Local execution: mvn spring-boot:run
# Requires: PostgreSQL on localhost:5432, Kafka on localhost:9092
# ─────────────────────────────────────────────────────────────────────────────

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/employee_directory
    username: intern_user
    password: intern123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    # Producer settings are now in KafkaProducerConfig (explicit bean).
    # Consumer settings remain here for auto-config of listener factories.
    consumer:
      group-id: employee-directory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.act.intern.employeedirectory.enterprise.infrastructure.messaging.dto"

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha

kafka:
  topics:
    employee-events: employee-events
    department-events: department-events
    audit-events: audit-events

logging:
  level:
    # Your application — shows [KAFKA] ✅ lines
    com.act.intern.employeedirectory: INFO
    # Spring Kafka internals — shows broker connect, metadata fetch
    org.springframework.kafka: INFO
    # Kafka client — shows actual send confirmations
    org.apache.kafka.clients.producer: INFO
    # Keep noisy ones quiet
    org.apache.kafka.clients.consumer: WARN
    org.apache.kafka.clients.NetworkClient: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
